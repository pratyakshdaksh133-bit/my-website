width: 95%;
height: 620px;
margin: 100px auto;
border-radius: 10px;
background-color: rgb(255, 122, 122);
box-shadow: 0 0 10px rgb(255, 122, 122);
}
#inputarea, #outputarea{
width: 90%;
height: 150px;
margin: 10px 5%;

resize: none;
outline: none;
}

#trans{
width: 95%;
height: 50px;
margin: 10px 2%;
color: white;
border-radius: 5px ;
border: none;
background-color: rgb(252, 121, 70);
box-shadow: inset 0 10px 10px rgba(0, 0, 0, 0.521), inset -10px -0 10px rgba(252, 121, 70, 0.521);
transition-property: all;
}
#trans:focus{
background-color:  rgb(255, 67, 67);
transition-duration: 2s;
}
#text-copy{
  width: 95%;
  height: 50px;
  margin: 5px 2%;
  color: rgb(0, 0, 0);
  background-color: red;
  border: none;
  border-radius: 10px;
  box-shadow: inset 10px 10px 10px black, inset -10px -10px 10px red;
  transition-property: all;
}
#text-copy:focus{
  background-color: green;
  box-shadow: inset 10px 10px 10px black, inset -10px -10px 10px green;
  transition-duration: 2s;
}
#direction{
width: 90%;
height: 30px;
margin: 5px 5%;
outline: none;
cursor:pointer;
}
#outputarea{
font-family: 'Dancing Script', cursive;

    <!--ENGLISH TO HINDI TRANSLATOR CODE START-->
  <div class="container-DIV">

    <select id="direction">
      <option value="hi-en">Hindi → English</option>
     
          <option value="en-hi">English → Hindi</option>
          
      </select>

    <div class="container-box">

      <h2 id="trans-heading">Hindi ↔ English Translator</h2>
     
      <div class="translate-text-area">
        <div class="trans-area">
          <textarea id="inputarea" placeholder="write text here"></textarea>
        </div>
        
   
         <div class="trans-area">
           <textarea id="outputarea" readonly> output will come here...</textarea>
         </div>
      </div>
     
     <div class="buttons">
      <button id="trans" onclick="translateText()">Translate</button>
      <button id="text-copy" style="color: white; font-size: 20px;"><i style="color: white; font-size: 20px;" class="fa fa-clone" aria-hidden="true"></i>COPY</button>
     </div>
    </div>
  </div>
  <!--ENGLISH TO HINDI TRANSLATOR CODE END-->
  <script>
     if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js");
     }

     let button = document.getElementById('text-copy')
     let area = document.getElementById("outputarea")
     button.addEventListener("click", function(){
      navigator.clipboard.writeText(area.value)
      alert("text copied to clipboard")
     })
  </script>
