<body>
    
      <header>
        <a href="index.html"> ⬅ Back</a>
        <div class="buttons">
          <button id="trans" onclick="translateText()">Translate</button>
    
          <button onclick="speakText()" id="speaker"><i class="fa-solid fa-volume"></i>Speak</button>
          <button id="text-copy">Copy</button>
         </div>
         
    <select id="direction">
      <option value="hi-en">Hindi → English</option>
     
          <option value="en-hi">English → Hindi</option>
          
      </select>
      </header>
    
    <!--ENGLISH TO HINDI TRANSLATOR CODE START-->
  <div class="container-DIV">


    <div class="container-box">

      <h2 id="trans-heading">Hindi ↔ English Translator</h2>
     
      <div class="translate-text-area">
        <div class="trans-area">
          <textarea id="inputarea" placeholder="write text here"></textarea>
        </div>
        
   
         <div class="trans-area">
           <textarea id="outputarea" readonly> output will come here...</textarea>
         </div>
      </div>
     
     
    </div>
  </div>
  <!--ENGLISH TO HINDI TRANSLATOR CODE END-->
  <script>
     //if ("serviceWorker" in navigator) {
          //navigator.serviceWorker.register("service-worker.js");
     //}

     let button = document.getElementById('text-copy')
     let area = document.getElementById("outputarea")
     button.addEventListener("click", function(){
      navigator.clipboard.writeText(area.value)
      alert("text copied to clipboard")
     })
  function speakText() {
    let text = document.getElementById("outputarea").value;

    if(text === ""){
      alert("Pehle kuch likho!");
      return;
    }

    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "hi-IN"; // Hindi voice

    window.speechSynthesis.speak(speech);
  }
  </script>
