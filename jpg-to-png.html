<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Document</title>
    <script src="script.js"></script>
    <style>
         /*JPG TO PNG CONVERTERT START*/
         *{
          margin: 0;
          padding: 0;
          text-decoration: none;
         }
         header{
          background-color: black;
          padding: 20px 0;
         }
         .header{
          text-align: center;
          display: flex;
          align-items: center;
          justify-content: space-evenly;
         }
         a{
          color: white;
          cursor: pointer;
         }
         button{
          cursor: pointer;
          color:white;
          border: none;
          background-color: black;
         }
 #tool-wrapper{
  max-width: 480vw;
  width: 100vw;
  height: 350px;
  margin: 50px auto;
  border: none;
  border-radius: 15px;
  background-color: rgb(146, 213, 252);
}
.container{
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
}
#dropArea{
  width: 85%;
  height: 250px;
  overflow: hidden;
  margin: 10px auto;
  border: 2px groove black;
  border-radius: 5px;
  background: rgba(255, 255, 195, 0.664);
  display: flex;
  align-items: center;
  text-align: center;
  justify-content: center;
 
}

#tool-wrapper h2{
 text-align: center;
}

/*JPG TO PNG SIMPLE DESIGN FINISH*/
/*JPG TO PNG RESPONSIVE DESIGN START*/
@media (min-width:500px) {
#tool-wrapper{
max-width: 600px;
width: 100vw;
margin:50px auto ;

}
#hueRange{
 font-size: 20px;
}
}
@media (min-width:700px) {
#tool-wrapper{
  height: 450px;
width: 100%;
max-width: 800px;
}
#dropArea{
 height: 300px;
}
#hueRange{
 width: 50%;
}
.container h2{
 font-size: 35px;
}
}
@media (min-width:800px) {
#tool-wrapper{
  width: 100%;
  max-width: 900px;
}
}

/*JPG TO PNG CODE FINISH WITH RESPONSIVE CODE FINISH*/




    </style>
</head>
<body>
  <header>
    <div class="header">
      <a href="index.html">⬅ Back</a>
      <button id="selectBtn">UPLOAD IMAGE <i class="fa fa-cloud-upload" aria-hidden="true"></i></button>
         <a id="downloadBtn" download="converted.png" >Download PNG <i class="fa fa-download" aria-hidden="true"></i></a>
    </div>
  </header>
    <div id="tool-wrapper">
        <div class="container">
         <h2>JPG / JPEG → PNG</h2>
         
         <div class="drop-area" id="dropArea">
             <img id="preview" hidden>
             <p id="text">Drag & Drop Image</p>
             <input type="file" id="fileInput" accept="image/jpeg,image/jpg" hidden>
         </div>
         
         <label>Change Color</label>
         <input type="range" id="hueRange" min="0" max="360">
         </div>
      </div>
         <canvas id="canvas" hidden></canvas>
       <!--JPG TO PNG CONVERTOR CODE END-->
      
     
</body>
</html>
