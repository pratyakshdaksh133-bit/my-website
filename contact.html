    <style>
        *{
            text-decoration: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body{
          height: 100%;
          background:linear-gradient(to left top, rgb(99, 0, 99), rgb(189, 3, 189),  rgb(230, 39, 255), rgb(72, 72, 241), rgb(119, 119, 255), rgb(171, 210, 255), rgb(207, 207, 255));
        }
       .mail{
        height: 400px;
        width: 350px;
        border: none;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(243, 194, 104);
       }
       .mail-box{
        display: flex;
        align-items: center;
        justify-content: center;
       }
       input{
        outline: none;
        border: none;
        border-radius: 5px;
        padding: 20px 50px;
        box-shadow: 0 0 10px black;
       }
       textarea{
        outline: none;
        padding: 50px;
        border: none;
        border-radius: 5px;
        box-shadow: 0 0 10px black;
        resize: none;
       }
       button{
        margin: 10px auto;
        columns: white;
        background-color: green;
        border: none;
        border-radius: 10px;
        padding: 15px 90px ;
        box-shadow:inset 10px 10px 10px black, inset 10px 10px 10px green;
       }
      #images-div{
        display: flex;
        flex-direction: column;
      }

     }
      .main{
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        
      }
      .icon i{
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
