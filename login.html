<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>SIGNIN PAGE</title>
    <style>
      *{
        margin: 0;
        padding: 0;
        text-decoration: none;
      }
      .login-box{
        width: 100%;
        height: 620px;
        position: relative;   
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(33, 163, 83, 0.534);
      }
      #sign-in-icon{
        left: 50%;
      right: 50%;
      z-index: 20;
      margin-top: -70px;
      margin-left: auto;
      margin-right: auto;
      font-size: 120px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
}
        label, i{
            color: rgb(3, 3, 3);
            font-size: 30px;
        }
      
        h1{
            color: orangered;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 90px ;
        }
        
        .input-box input{
           display: flex;
           width: 340px;
           padding:20px 0;
           margin: 10px;
           border-radius: 5px;
           border: 2px solid rgb(1, 1, 39);
           outline: none;
           text-decoration: none;
          
          font-size: 20px;
          text-align: center;
        }
        .user-icon #user{
            margin-top: 50px;
        }
    
            
        
        button{
            color: white;
            border-radius:15px ;
            width: 87%;
            padding: 20px 0;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: inset 10px 10px 10px rgba(0, 0, 0, 0.521), inset -10px -10px 10px rgba(0, 128, 0, 0.521);
            background-color: green;
        }
        #loader-div{
          display: flex;
      align-items: center;
      justify-content: center;
        }
      .loader{
      width: 50px;
      height: 50px;
      display: none;
      border-radius: 50%;
      animation: spin 3s  infinite;
      border-top: 10px dotted black;
      border: 10px dotted rgb(94, 94, 94);
      }
      @keyframes spin {
        to{transform: rotate(0deg);}
        from{transform: rotate(360deg);}
      }
    </style>
</head>
<body>
  <input type="text" id="name" placeholder="Name">
  <input type="email" id="email" placeholder="Email">
  <input type="file" id="img">
  
  <button onclick="signup()">Signup</button>
  
  <script>
  function signup(){
  
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  
  let img = document.getElementById("img").files[0];
  
  let reader = new FileReader();
  
  reader.onload = function(){
  
  let user = {
  name:name,
  email:email,
  img:reader.result
  };
  
  localStorage.setItem("user", JSON.stringify(user));
  
  window.location.href="index.html";
  
  }
  
  reader.readAsDataURL(img);
  
  }
  //SERVICE WORKER CODE INSTALL KARNE WALA//
 //if ("serviceWorker" in navigator) {
        // navigator.serviceWorker.register("service-worker.js");
      //}
  </script>

 

 
</body>
</html>
