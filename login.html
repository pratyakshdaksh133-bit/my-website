<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>SIGNIN PAGE</title>
    <style>
      *{
        margin: 0;
        padding: 0;
        text-decoration: none;
      }
      .login-box{
        width: 100%;
        height: 620px;
        position: relative;   
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(33, 163, 83, 0.534);
      }
      #sign-in-icon{
        left: 50%;
      right: 50%;
      z-index: 20;
      margin-top: -70px;
      margin-left: auto;
      margin-right: auto;
      font-size: 120px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
}
        label, i{
            color: rgb(3, 3, 3);
            font-size: 30px;
        }
      
        h1{
            color: orangered;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 90px ;
        }
        
        .input-box input{
           display: flex;
           width: 340px;
           padding:20px 0;
           margin: 10px;
           border-radius: 5px;
           border: 2px solid rgb(1, 1, 39);
           outline: none;
           text-decoration: none;
          
          font-size: 20px;
          text-align: center;
        }
        .user-icon #user{
            margin-top: 50px;
        }
    
            
        
        button{
            color: white;
            background-color: green;
            border: 5px outset green;
            border-radius:15px ;
            width: 87%;
            padding: 20px 0;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
      
    </style>
</head>
<body>
    <div class="user-info">
        <h1>Welcome</h1>
    </div>

    <div class="main-box">

        <i id="sign-in-icon" class="fa fa-user-circle" aria-hidden="true"></i>

    <div class="login-box" id="loginwebpage">
        
        <div class="input-box">
            
               <label for="name">Name:</label>

               <span class="user-icon"><i id="user" class="fa fa-user-circle" aria-hidden="true"></i></span>
               <input id="name" type="text" placeholder="User Name"><br><br>

            
              
            <label for="email">Email:</label>
            <span class="user-icon"><i class="fa fa-envelope"></i></span>
            <input id="email" type="email" placeholder="Email"><br><br>
            <label for="passord">Password:</label>
            <span class="user-icon"><i class="fa-solid fa-lock"></i></span>
            <input id="password" type="password" placeholder="Password"><br>
            <button onclick="saveUserData()">SIGN UP</button>
          
        </div>
    </div>
    </div>
    <script>
      
function saveUserData() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();

  if (name === "" || email === "" || pass === "") {
    alert("❌ Please sab fields fill karo");
    return; 
  }

  const userData = { name, email, pass };
  localStorage.setItem("userData", JSON.stringify(userData));

  window.location.href = "index.html"; // ✅ sirf tab jab form filled ho


}

 //SERVICE WORKER CODE INSTALL KARNE WALA//
 if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js");
      }

</script>   
</body>
</html>
