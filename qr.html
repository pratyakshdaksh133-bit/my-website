<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>QR CODE GENERATOR</title>
    <script src="script.js"></script>
    <style>
         /*TEXT TO QR CODE MAKER CODE START AND RESPONSIVE  DEISGN START*/
         *{
            margin:0;
            padding:0;
            text-decoration: none;
         }
         header{
          background-color: black;
         padding: 20px 0;
         }
       .qr-button-div{
        display: flex;
        justify-content: space-evenly;
       }
        button{
          color: white;
          border: none;
          background-color: black;
          display: inline-block;
        }
        .generator{
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #maker{
          color: white;
          background-color: purple;
          padding: 20px 0;
          width: 50%;
          border-radius: 5px;
          box-shadow: 0 0 10px red;
        }
        #qrBox{
          border: 1px solid red;
          box-shadow: 0 0 10px red;
        }
 #qrcode-box{
  
 margin: 20px auto;
  width: 80%;
  height: 630px;
  max-width: 500px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
#qrcode-box h2{
  text-align: center;
}
#qrarea{
  width: 50%;
  height: 50%;
  margin: 10px 5%;
  resize: none;
  overflow: hidden;
  outline: none;
  box-shadow: 0 0 10px black;
 
}
#qrarea:focus{
  position: relative;
  animation: move 5s alternate linear ;
  animation-fill-mode: forwards;
}
@keyframes move {
    to{width: 60%;}
    from{width: 0%;}
  }
.main-qr{
  display: flex;
  align-items: center;
  justify-content: center;
}

@media(min-width:500px){
  #qrcode-box{
    width: 95%;
    max-width: 600px;
  }
}
@media(min-width:600px){
  #qrcode-box{
    width: 95%;
    max-width: 700px;
  }
  
}

@media(min-width:700px){
  #qrcode-box{
    width: 95%;
    max-width: 800px;
  }
  
}
@media(min-width:800px){
  #qrcode-box{
    width: 95%;
    max-width: 900px;
  }
}
@media(min-width:900px){
  #qrcode-box{
    width: 95%;
    max-width: 1000px;
  }
}
@media(min-width:1000px){
  #qrcode-box{
    width: 95%;
    max-width: 1100px;
  }
  textarea{
    font-family: 30px;
  }
}
@media(min-width:1100px){
  #qrcode-box{
    width: 95%;
    max-width: 1200px;
  }
}

    </style>
</head>
<body>
  <header>
    <div class="qr-button-div">
    <a href="index.html" style="font-size:20px; color:white">Back</a>
      
      <button onclick="downloadQR()" id="download">Download</button>
      <button onclick="shareQR()" id="share">Share</button>
    </div>
  </header>
   
    <!--QR CODE MAKER START-->

<div id="qrcode-box">
    <h2>QR Code Maker</h2>
  
    <textarea id="qrarea" placeholder="Yahan kuch bhi likho..."></textarea>
    <br><br>
    <div class="generator">
      <button onclick="makeQR()" id="maker">Generate QR</button>
    </div>
  
    <br><br>
  
    <div id="qrBox"></div>
  </div>
  
  </div>
  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  
  <!--QR CODE CODE MAKER CODE FINISH-->
  <script>
     if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js");
     }
  </script>
</body>
</html>
